function equalShares(amount,pids){pids=[...new Set((pids||[]).filter(Boolean))];if(!pids.length)return{};const cents=Math.round(amount*100),base=Math.floor(cents/pids.length),rest=cents-base*pids.length,out={};pids.forEach((id,i)=>out[id]=(base+(i<rest?1:0))/100);return out}

function monthNav(){const cur=ui.month===mkOf(todayISO());return`<div class="monthbar"><button class="round" data-action="prev-month" aria-label="Mês anterior">${icon('left')}</button><div class="monthlabel">${mkLabel(ui.month)}</div><button class="round" data-action="next-month" aria-label="Próximo mês">${icon('right')}</button>${cur?'':`<button class="btn small todaybtn" data-action="goto-today">Hoje</button>`}</div>`}
function dueBucket(e){if(e.paid)return'paid';const t=todayISO();if(e.date<t)return'over';if(e.date===t)return'today';return'next'}
function openBillsHTML(t){const open=t.bills.filter(e=>!e.paid).sort((a,b)=>a.date.localeCompare(b.date));if(!open.length)return'';const groups=[['over','Vencidas'],['today','Vence hoje'],['next','Próximas']];return`<div class="section-head"><h2>Contas em aberto</h2><span class="aux">${open.length} · ${fmtBRL(t.due)}</span></div>`+groups.map(([key,label])=>{const arr=open.filter(e=>dueBucket(e)===key);if(!arr.length)return'';return`<div class="due-group"><div class="due-title ${key}">${label}</div>${arr.map(e=>{const p=P(e.profileId);const shareTxt=Object.keys(splitShares(e)).length===1?'pessoal':`${Object.keys(splitShares(e)).length} pessoas`;return`<div class="billrow"><div><b>${esc(e.title)}</b><div class="meta"><span>${esc(e.category)}</span><span>${fmtDay(e.date)}</span><span class="chip">${shareTxt}</span>${e.recurringId?'<span class="chip">fixa</span>':''}${e.installTotal?`<button class="chip" data-action="view-installments" data-gid="${e.groupId}">${e.installSeq}/${e.installTotal}x</button>`:''}${ava(p,'xs')}</div></div><span class="bill-value">${fmtBRL(e.amount)}</span><button class="btn good small" data-action="pay" data-id="${e.id}">${icon('check','sm')} Quitar</button></div>`}).join('')}</div>`}).join('')}
function rateioHTML(mk){const rows=obligations(mk),sugs=settleSuggestions(rows),max=Math.max(1,...rows.map(r=>r.planned));const body=rows.map(r=>{const w=Math.round(r.planned/max*100);const b=r.balance>0.005?`<span class="balance pos">+ ${fmtBRL(r.balance)} a receber</span>`:r.balance<-.005?`<span class="balance neg">${fmtBRL(-r.balance)} a repor</span>`:`<span class="balance zero">em dia</span>`;return`<div class="rrow"><span>${ava(r.p,'lg')}</span><div><div class="rname">${esc(r.p.name)}</div><div class="rsub">responsabilidade do mês ${fmtBRL(r.planned)}</div></div><div class="rside"><small>já saiu do bolso</small><b>${fmtBRL(r.paidForOthers)}</b></div><div class="rbar" style="--c:${r.p.color}"><i style="width:${w}%"></i></div><div>${b}</div></div>`}).join('');const trans=sugs.length?`<div class="settles"><span class="eyebrow">Acerto sugerido</span>${sugs.map(s=>`<button class="settle-chip" data-action="settle-suggest" data-from="${s.from}" data-to="${s.to}" data-amount="${s.amount}">${ava(P(s.from),'xs')}${icon('arrow','sm')}${ava(P(s.to),'xs')} ${fmtBRL(s.amount)} ${icon('check','sm')}</button>`).join('')}<button class="btn small" data-action="manual-settle">Registrar outro acerto</button></div>`:`<div class="settles"><span class="balance zero">Nada a acertar nas contas já pagas</span><button class="btn small" data-action="manual-settle">Registrar acerto</button></div>`;return`<div class="section-head"><h2>Rateio da casa</h2><span class="aux">cada conta segue a divisão escolhida</span></div><div class="rate-grid">${body}</div>${trans}`}
function fundSummary(mk,t){const ft=fundTotal(),target=state.fund.target,pct=target>0?Math.max(0,Math.min(100,Math.round(ft/target*100))):0,saved=state.fund.savedMonths[mk];const closed=t.tBills>0&&t.nOpen===0;const canSave=closed&&t.surplus>0&&!saved;return`<div class="section-head"><h2>Fundo da casa</h2><span class="aux">${pct}% da meta</span></div><div class="fcard"><div class="fhead"><h3>${esc(state.fund.name)}</h3><button class="iconbtn" data-action="goto-fund" aria-label="Abrir fundo">${icon('right')}</button></div><div class="fnums"><span class="ftotal">${fmtBRL(ft)}</span><span class="ftarget">de ${fmtBRL(target)}</span></div><div class="fbar"><span class="pct">${pct}%</span><div class="fill" style="width:${pct}%"></div></div>${canSave?`<div class="surplus"><p>O mês está fechado e sobrou <b>${fmtBRL(t.surplus)}</b>. Agora essa sobra é real.</p><button class="btn primary small" data-action="fund-save-surplus">Guardar no fundo</button></div>`:''}${saved?`<div class="note" style="margin-top:14px">A sobra deste mês (${fmtBRL(saved.amount)}) já foi guardada no fundo.</div>`:''}</div>`}
function feedHTML(){if(!state.log.length)return`<div class="empty"><div class="empty-ic">${icon('receipt','lg')}</div><b>O livro está quieto</b><span>Lançamentos, pagamentos, acertos e movimentos do fundo aparecem aqui.</span></div>`;return`<ul class="feed">${state.log.slice(0,12).map(l=>{const p=P(l.pid),map={pay:'pagou',bill:'lançou',inc:'registrou',fund:'movimentou o fundo',fixed:'criou a fixa',settle:'fez um acerto',reopen:'reabriu'};return`<li><span class="feed-dot" style="--c:${p?.color||'#777'}">${icon(l.act==='fund'?'fund':l.act==='settle'?'arrow':l.act==='pay'?'check':'receipt','sm')}</span><span><b>${esc(p?.name||'Casa')}</b> ${map[l.act]||'alterou'} <i>${esc(l.title||'')}</i></span>${l.amount?`<b>${fmtBRL(Math.abs(l.amount))}</b>`:''}<time>${relTime(l.ts)}</time></li>`}).join('')}</ul>`}
function viewPainel(){const mk=ui.month,t=totals(mk),closed=t.tBills>0&&t.nOpen===0,pct=t.tBills>0?Math.round(t.tPaid/t.tBills*100):0;let hero=closed?`<div class="hero-num pos">Mês em ordem</div><p class="hero-sub">Todas as ${t.nB} contas foram quitadas.${t.surplus>0?` Sobra real de <b>${fmtBRL(t.surplus)}</b>.`:''}</p>`:t.nB===0?`<div class="hero-num mute">${fmtBRL(0)}</div><p class="hero-sub">Nada lançado em ${mkLabel(mk)}. Use <b>Lançar</b> para começar.</p>`:`<div class="hero-num">${fmtBRL(t.due)}</div><p class="hero-sub">faltam pagar de <b>${fmtBRL(t.tBills)}</b> em contas · ${t.nB-t.nOpen} de ${t.nB} quitadas</p>`;return`${monthNav()}<section class="hero"><span class="eyebrow">${closed?'Fechamento do mês':'Falta para fechar o mês'}</span>${hero}<div class="progress-row"><div class="progress"><i style="width:${Math.min(100,pct)}%"></i></div><span class="progress-pct">${pct}% quitado</span></div><div class="stats"><div class="stat"><span class="stat-label">Ganhos</span><div class="stat-val">${fmtBRL(t.tInc)}</div><span class="stat-sub">${t.nI} registro${t.nI===1?'':'s'}</span></div><div class="stat"><span class="stat-label">Contas</span><div class="stat-val">${fmtBRL(t.tBills)}</div><span class="stat-sub">${t.nB} conta${t.nB===1?'':'s'}</span></div><div class="stat"><span class="stat-label">Já pago</span><div class="stat-val pos">${fmtBRL(t.tPaid)}</div><span class="stat-sub">${pct}% do total</span></div><div class="stat"><span class="stat-label">${t.surplus>=0?'Sobra projetada':'Falta cobrir'}</span><div class="stat-val ${t.surplus>=0?'pos':'neg'}">${fmtBRL(Math.abs(t.surplus))}</div><span class="stat-sub">ganhos − contas</span></div></div></section>${openBillsHTML(t)}${rateioHTML(mk)}${fundSummary(mk,t)}<div class="section-head"><h2>Movimentos recentes</h2></div>${feedHTML()}`}

function filteredEntries(){let es=[...state.entries];if(ui.reg.pid)es=es.filter(e=>e.profileId===ui.reg.pid);if(ui.reg.type!=='all')es=es.filter(e=>e.type===ui.reg.type);if(ui.reg.status==='open')es=es.filter(e=>e.type==='bill'&&!e.paid);if(ui.reg.status==='paid')es=es.filter(e=>e.type==='bill'&&e.paid);if(ui.reg.q){const q=ui.reg.q.toLowerCase();es=es.filter(e=>(e.title||'').toLowerCase().includes(q)||(e.category||'').toLowerCase().includes(q))}return es}
function entryList(){const es=filteredEntries(),months=[...new Set(es.map(e=>e.month))].sort().reverse();if(!months.length)return`<div class="empty"><div class="empty-ic">${icon('search','lg')}</div><b>Nada por aqui</b><span>Nenhum lançamento combina com os filtros atuais.</span></div>`;return months.map(m=>{const list=es.filter(e=>e.month===m).sort((a,b)=>b.date.localeCompare(a.date));const tb=sum(list.filter(e=>e.type==='bill').map(e=>e.amount)),ti=sum(list.filter(e=>e.type==='income').map(e=>e.amount));return`<div class="month-group"><div class="month-group-head"><h3>${mkLabel(m)}</h3><em>${list.length} lanç. · ${fmtBRL(tb)} contas · ${fmtBRL(ti)} ganhos</em></div><ul class="entry-list">${list.map(e=>{const p=P(e.profileId),shares=Object.keys(splitShares(e));return`<li class="entry"><span>${ava(p,'xs')}</span><div class="entry-main"><b>${esc(e.title)}</b><div class="meta"><span>${esc(e.category)}</span><span>${fmtDay(e.date)}</span>${e.type==='bill'?`<span class="chip">${shares.length===1?'pessoal':`${shares.length} pessoas`}</span>`:''}${e.recurringId?'<span class="chip">fixa</span>':''}${e.installTotal?`<button class="chip" data-action="view-installments" data-gid="${e.groupId}">${e.installSeq}/${e.installTotal}x</button>`:''}${e.paidBy&&e.type==='bill'?`<span class="chip">${esc(P(e.paidBy)?.name||'')} pagou</span>`:''}</div></div><div class="entry-right"><div class="entry-value ${e.type==='income'?'pos':''}">${e.type==='income'?'+':'−'} ${fmtBRL(e.amount)}</div><span class="status ${e.type==='income'?'income':e.paid?'paid':'open'}">${e.type==='income'?'ganho':e.paid?'paga':'aberta'}</span></div><div class="entry-actions">${e.type==='bill'?(e.paid?`<button class="iconbtn" data-action="reopen" data-id="${e.id}" aria-label="Reabrir">${icon('undo')}</button>`:`<button class="iconbtn" data-action="pay" data-id="${e.id}" aria-label="Quitar">${icon('check')}</button>`):''}<button class="iconbtn" data-action="edit" data-id="${e.id}" aria-label="Editar">${icon('edit')}</button><button class="iconbtn" data-action="del" data-id="${e.id}" aria-label="Excluir">${icon('trash')}</button></div></li>`}).join('')}</ul></div>`}).join('')}
function fixedList(){if(!state.recurring.length)return`<div class="empty"><div class="empty-ic">${icon('repeat','lg')}</div><b>Sem contas fixas</b><span>Cadastre aluguel, internet e outras contas recorrentes uma vez.</span><button class="btn primary" data-action="open-add-fixed">Criar conta fixa</button></div>`;return`<div class="note">Contas fixas entram automaticamente a cada mês dentro do período configurado.</div>${state.recurring.map(r=>`<div class="fixed-row ${r.active?'':'off'}"><span>${icon('repeat')}</span><div><b>${esc(r.title)}</b><div class="meta"><span>${esc(r.category)}</span><span>dia ${r.day}</span><span>${Object.keys(splitForAmount(r.split,r.amount,r.amount).shares||{}).length||r.split?.participants?.length||0} pessoas</span>${ava(P(r.profileId),'xs')}</div></div><b class="bill-value">${fmtBRL(r.amount)}</b><div class="fixed-actions"><label class="switch" title="${r.active?'Ativa':'Pausada'}"><input type="checkbox" data-role="fix-toggle" data-rid="${r.id}" ${r.active?'checked':''}><i></i></label><button class="iconbtn" data-action="edit-fixed" data-rid="${r.id}" aria-label="Editar">${icon('edit')}</button><button class="iconbtn" data-action="del-fixed" data-rid="${r.id}" aria-label="Excluir">${icon('trash')}</button></div></div>`).join('')}<div style="margin-top:15px"><button class="btn primary" data-action="open-add-fixed">${icon('plus','sm')} Nova conta fixa</button></div>`}
function viewLanc(){const chips=activeProfiles().map(p=>`<button class="pchip ${ui.reg.pid===p.id?'on':''}" style="--c:${p.color}" data-action="fpick" data-pid="${p.id}">${ava(p,'xs')}${esc(p.name)}</button>`).join('');return`<div class="tabs"><button class="${ui.subtab==='registro'?'on':''}" data-action="subtab" data-t="registro">Registro</button><button class="${ui.subtab==='fixas'?'on':''}" data-action="subtab" data-t="fixas">Contas fixas (${state.recurring.length})</button><button class="${ui.subtab==='acertos'?'on':''}" data-action="subtab" data-t="acertos">Acertos (${state.settlements.length})</button></div>${ui.subtab==='fixas'?fixedList():ui.subtab==='acertos'?settlementHistory():`<div class="filters"><div class="people-filter"><button class="pchip ${!ui.reg.pid?'on':''}" style="--c:var(--ink)" data-action="fpick" data-pid="">Todos</button>${chips}</div><div class="seg"><button class="${ui.reg.type==='all'?'on':''}" data-action="ftype" data-v="all">Tudo</button><button class="${ui.reg.type==='bill'?'on':''}" data-action="ftype" data-v="bill">Contas</button><button class="${ui.reg.type==='income'?'on':''}" data-action="ftype" data-v="income">Ganhos</button></div><div class="seg"><button class="${ui.reg.status==='all'?'on':''}" data-action="fstatus" data-v="all">Tudo</button><button class="${ui.reg.status==='open'?'on':''}" data-action="fstatus" data-v="open">Abertas</button><button class="${ui.reg.status==='paid'?'on':''}" data-action="fstatus" data-v="paid">Pagas</button></div><div class="search">${icon('search')}<input data-role="reg-search" placeholder="Buscar…" value="${esc(ui.reg.q)}"></div></div><div id="reg-list">${entryList()}</div>`}`}
function settlementHistory(){const list=[...state.settlements].sort((a,b)=>b.ts-a.ts);return`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn primary" data-action="manual-settle">${icon('plus','sm')} Registrar acerto</button></div>${list.length?`<ul class="fundlog">${list.map(s=>`<li><time>${fmtDay(s.date)}</time><span>${ava(P(s.from),'xs')} <b>${esc(P(s.from)?.name||'')}</b> ${icon('arrow','sm')} ${ava(P(s.to),'xs')} <b>${esc(P(s.to)?.name||'')}</b>${s.note?`<div class="meta">${esc(s.note)}</div>`:''}</span><span class="amount pos">${fmtBRL(s.amount)}</span><button class="iconbtn" data-action="del-settle" data-id="${s.id}" aria-label="Excluir acerto">${icon('trash')}</button></li>`).join('')}</ul>`:`<div class="empty"><b>Nenhum acerto registrado</b><span>Quando alguém fizer Pix ou devolver dinheiro para outra pessoa, registre aqui.</span></div>`}`}

function viewFundo(){const ft=fundTotal(),target=state.fund.target,pct=target>0?Math.max(0,Math.min(100,Math.round(ft/target*100))):0;const asc=[...state.fund.log].sort((a,b)=>a.ts-b.ts);let bal=0;const balAfter={};asc.forEach(l=>{bal=r2(bal+l.amount);balAfter[l.id]=bal});const hist=[...asc].reverse();return`<div class="section-head" style="margin-top:22px"><h2>Fundo da casa</h2><span class="aux">${pct}% da meta</span></div><div class="fcard"><div class="fhead"><h3>${esc(state.fund.name)}</h3><button class="iconbtn" data-action="edit-fund-goal" aria-label="Editar meta">${icon('edit')}</button></div><div class="fnums"><span class="ftotal">${fmtBRL(ft)}</span><span class="ftarget">guardados de ${fmtBRL(target)}${target>0&&ft<target?` · faltam ${fmtBRL(target-ft)}`:target>0?' · meta cumprida':''}</span></div><div class="fbar"><span class="pct">${pct}%</span><div class="fill" style="width:${pct}%"></div></div><div class="factions"><button class="btn primary" data-action="fund-deposit" data-mode="in">${icon('fund','sm')} Guardar dinheiro</button><button class="btn" data-action="fund-deposit" data-mode="out" ${ft<=0?'disabled':''}>Retirar</button></div></div><div class="section-head"><h2>Histórico do fundo</h2><span class="aux">${hist.length} movimento${hist.length===1?'':'s'}</span></div>${hist.length?`<ul class="fundlog">${hist.map(l=>`<li><time>${fmtDay(isoLocal(new Date(l.ts)))}</time><span><b>${esc(l.label)}</b></span><span class="amount ${l.amount>=0?'pos':'neg'}">${l.amount>=0?'+':'−'} ${fmtBRL(Math.abs(l.amount))}</span><span class="bal">saldo ${fmtBRL(balAfter[l.id])} <button class="iconbtn" data-action="del-fund" data-id="${l.id}" aria-label="Excluir">${icon('trash','sm')}</button></span></li>`).join('')}</ul>`:`<div class="empty"><div class="empty-ic">${icon('fund','lg')}</div><b>Cofre vazio</b><span>O primeiro aporte pode ser uma sobra de mês fechado.</span></div>`}`}

function viewReports(){const months=Array.from({length:6},(_,i)=>mkShift(ui.month,-5+i)),ts=months.map(m=>({m,...totals(m)})),max=Math.max(1,...ts.map(x=>Math.max(x.tBills,x.tInc)));const cur=totals(ui.month),cats={};cur.bills.forEach(e=>cats[e.category]=r2((cats[e.category]||0)+e.amount));const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]),catMax=Math.max(1,...catArr.map(x=>x[1]));const rows=obligations(ui.month);return`${monthNav()}<div class="section-head"><h2>Relatórios</h2><span class="aux">visão simples, sem poluição</span></div><div class="report-grid"><div class="report-card"><h3>Gastos por categoria</h3>${catArr.length?catArr.map(([c,v])=>`<div class="cat-row"><span>${esc(c)}</span><div class="bar"><i style="width:${Math.round(v/catMax*100)}%"></i></div><b>${fmtBRL(v)}</b></div>`).join(''):'<div class="note">Sem despesas neste mês.</div>'}</div><div class="report-card"><h3>Responsabilidade por pessoa</h3>${rows.map(r=>`<div class="cat-row"><span>${esc(r.p.name)}</span><div class="bar"><i style="width:${cur.tBills?Math.round(r.planned/cur.tBills*100):0}%;background:${r.p.color}"></i></div><b>${fmtBRL(r.planned)}</b></div>`).join('')}</div><div class="report-card wide"><h3>Últimos 6 meses</h3>${ts.map(x=>`<div class="trend-row"><span>${mkShort(x.m)}</span><div><div class="bar" title="Contas"><i class="neg" style="width:${Math.round(x.tBills/max*100)}%"></i></div><div class="bar" style="margin-top:3px" title="Ganhos"><i class="pos" style="width:${Math.round(x.tInc/max*100)}%"></i></div></div><b>${fmtBRL(x.tBills)}</b></div>`).join('')}<div class="meta" style="margin-top:12px"><span class="chip neg">linha 1: contas</span><span class="chip pos">linha 2: ganhos</span></div></div><div class="report-card"><h3>Fechamento</h3><div class="stats" style="margin:0"><div class="stat"><span class="stat-label">Resultado</span><div class="stat-val ${cur.surplus>=0?'pos':'neg'}">${fmtBRL(cur.surplus)}</div></div><div class="stat"><span class="stat-label">Em aberto</span><div class="stat-val">${fmtBRL(cur.due)}</div></div></div></div></div>`}

function openModal(html,{lock=false,nofocus=false}={}){closeModal();const ov=document.createElement('div');ov.className='overlay';ov.id='overlay';ov.innerHTML=`<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="handle"></div>${html}</div>`;if(!lock)ov.addEventListener('click',e=>{if(e.target===ov)closeModal()});$('#modal-root').appendChild(ov);document.body.style.overflow='hidden';refreshIcons(ov);if(!nofocus){const f=ov.querySelector('input:not([type=hidden]),select,button');setTimeout(()=>f?.focus(),50)}}
function closeModal(){const o=$('#overlay');if(o)o.remove();document.body.style.overflow='';window.__editing=null;window.__fixedEditing=null}
function mHead(title,ic='info'){return`<div class="modal-head">${icon(ic,'sm')} ${esc(title)} <button class="iconbtn" data-action="close-modal" aria-label="Fechar">${icon('x')}</button></div>`}
function catButtons(type,selected){return`<div class="category-chips">${state.categories[type].map(c=>`<button type="button" class="catbtn ${c===selected?'on':''}" data-action="pick-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
function profileButtons(selected,act='pick-resp'){return`<div class="profile-chips">${activeProfiles().map(p=>`<button type="button" class="pchip ${p.id===selected?'on':''}" style="--c:${p.color}" data-action="${act}" data-pid="${p.id}">${ava(p,'xs')}${esc(p.name)}</button>`).join('')}</div>`}
function splitUI(item){const active=activeProfiles(),existing=item?.split||{mode:'equal',participants:active.map(p=>p.id)},mode=existing.mode==='custom'?'custom':(existing.participants?.length===active.length?'all':'selected'),participants=existing.participants||Object.keys(existing.shares||{});return`<div class="field" id="split-section"><span class="field-label">Quem divide esta conta?</span><div class="seg"><button type="button" class="${mode==='all'?'on':''}" data-action="split-mode" data-mode="all">Todos</button><button type="button" class="${mode==='selected'?'on':''}" data-action="split-mode" data-mode="selected">Selecionar</button><button type="button" class="${mode==='custom'?'on':''}" data-action="split-mode" data-mode="custom">Valores</button></div><div id="split-body" style="margin-top:10px">${splitBodyHTML(mode,participants,existing.shares||{})}</div></div>`}
function splitBodyHTML(mode,participants=[],shares={}){const ps=activeProfiles();if(mode==='all')return`<div class="note">A conta será dividida igualmente entre ${ps.length} pessoa${ps.length===1?'':'s'}.</div>`;if(mode==='selected')return`<div class="split-chips">${ps.map(p=>`<button type="button" class="pchip ${participants.includes(p.id)?'on':''}" style="--c:${p.color}" data-action="toggle-split-person" data-pid="${p.id}">${ava(p,'xs')}${esc(p.name)}</button>`).join('')}</div><div class="split-summary" id="split-summary">Escolha pelo menos uma pessoa.</div>`;return`${ps.map(p=>`<div class="split-custom-row"><span>${ava(p,'xs')} ${esc(p.name)}</span><input class="setting-input split-val" data-pid="${p.id}" inputmode="decimal" placeholder="0,00" value="${shares[p.id]?fmtNum(shares[p.id]):''}"></div>`).join('')}<div class="split-summary" id="split-summary">Os valores precisam somar o total da conta.</div>`}

/* ---------- sincronização V4.1: entrada segura na casa + tempo real ---------- */
let sb=null,syncErr=false,pushTimer=null,realtimeChannel=null,syncing=false;
function loadSyncCfg(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch{return{}}}
function saveSyncCfg(cfg){localStorage.setItem(SYNC_KEY,JSON.stringify(cfg))}
function syncSignature(cfg=loadSyncCfg()){return `${cfg.url||''}|${String(cfg.recordId||'1')}`}
function schedulePush(){if(!sb)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushSync(false).catch(e=>console.error(e)),900)}
function loadSupabaseLib(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function mergeArray(local,remote,kind,tombs){const map=new Map();[...(local||[]),...(remote||[])].forEach(x=>{if(!x?.id)return;const old=map.get(x.id),xt=x.updatedAt||x.ts||x.createdAt||0,ot=old?(old.updatedAt||old.ts||old.createdAt||0):-1;if(!old||xt>=ot)map.set(x.id,x)});for(const [id,item] of [...map]){const del=tombs.filter(t=>t.kind===kind&&t.targetId===id).sort((a,b)=>b.ts-a.ts)[0];if(del&&del.ts>=(item.updatedAt||item.ts||item.createdAt||0))map.delete(id)}return[...map.values()]}
function mergeState(a,b){a=normalizeV4(structuredClone(a));b=normalizeV4(structuredClone(b));const tombs=mergeArray(a.tombstones,b.tombstones,'_none',[]);const out=defaultState();out.houseId=b.houseId||a.houseId;const houseA=a.houseUpdatedAt||0,houseB=b.houseUpdatedAt||0;out.houseName=houseA>houseB?a.houseName:b.houseName;out.houseUpdatedAt=Math.max(houseA,houseB);out.onboarded=a.onboarded||b.onboarded;out.profiles=mergeArray(a.profiles,b.profiles,'profile',tombs);out.entries=mergeArray(a.entries,b.entries,'entry',tombs);out.recurring=mergeArray(a.recurring,b.recurring,'recurring',tombs);out.settlements=mergeArray(a.settlements,b.settlements,'settlement',tombs);out.log=mergeArray(a.log,b.log,'log',tombs).sort((x,y)=>y.ts-x.ts).slice(0,100);out.tombstones=tombs.sort((x,y)=>y.ts-x.ts).slice(0,500);out.categories={bill:[...new Set([...a.categories.bill,...b.categories.bill])],income:[...new Set([...a.categories.income,...b.categories.income])]};out.fund={name:(a.fund.updatedAt||0)>(b.fund.updatedAt||0)?a.fund.name:b.fund.name,target:(a.fund.updatedAt||0)>(b.fund.updatedAt||0)?a.fund.target:b.fund.target,updatedAt:Math.max(a.fund.updatedAt||0,b.fund.updatedAt||0),log:mergeArray(a.fund.log,b.fund.log,'fundlog',tombs),savedMonths:{...b.fund.savedMonths,...a.fund.savedMonths}};for(const [m,v] of Object.entries(b.fund.savedMonths||{})){if(!out.fund.savedMonths[m]||(v.ts||0)>(out.fund.savedMonths[m].ts||0))out.fund.savedMonths[m]=v}out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);out.syncLastAt=Math.max(a.syncLastAt||0,b.syncLastAt||0);return normalizeV4(out)}
function hasFinancialData(s){return !!((s.entries||[]).length||(s.recurring||[]).length||(s.settlements||[]).length||(s.fund?.log||[]).length)}
function sameProfileUniverse(a,b){const A=new Set((a.profiles||[]).map(p=>p.id)),B=new Set((b.profiles||[]).map(p=>p.id));return [...A].some(id=>B.has(id))}
function remapProfileRefs(s,map){const c=structuredClone(s),rid=id=>map.get(id)||id;c.entries=(c.entries||[]).map(e=>{e.profileId=rid(e.profileId);e.paidBy=e.paidBy?rid(e.paidBy):e.paidBy;if(e.split?.participants)e.split.participants=e.split.participants.map(rid);if(e.split?.shares)e.split.shares=Object.fromEntries(Object.entries(e.split.shares).map(([id,v])=>[rid(id),v]));return e});c.recurring=(c.recurring||[]).map(r=>{r.profileId=rid(r.profileId);if(r.split?.participants)r.split.participants=r.split.participants.map(rid);if(r.split?.shares)r.split.shares=Object.fromEntries(Object.entries(r.split.shares).map(([id,v])=>[rid(id),v]));return r});c.settlements=(c.settlements||[]).map(x=>({...x,from:rid(x.from),to:rid(x.to)}));c.log=(c.log||[]).map(x=>({...x,pid:x.pid?rid(x.pid):x.pid}));return c}
function prepareFirstJoin(local,remote){local=normalizeV4(structuredClone(local));remote=normalizeV4(structuredClone(remote));if(!hasFinancialData(local))return remote;if(sameProfileUniverse(local,remote))return mergeState(local,remote);const lp=(local.profiles||[]).filter(p=>p.active!==false),rp=(remote.profiles||[]).filter(p=>p.active!==false),map=new Map();lp.forEach((p,i)=>{const byName=rp.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());const target=byName||rp[i];if(target)map.set(p.id,target.id)});const remapped=remapProfileRefs(local,map);remapped.profiles=remote.profiles;remapped.houseId=remote.houseId;remapped.houseName=remote.houseName;remapped.houseUpdatedAt=remote.houseUpdatedAt;return mergeState(remapped,remote)}
async function pullRemote(){if(!sb)return null;const cfg=loadSyncCfg(),id=String(cfg.recordId||'1');const{data,error}=await sb.from('livro').select('data,updated_at').eq('id',id).maybeSingle();if(error)throw error;return data?.data?migrate(data.data):null}
async function pushSync(notify=false){if(!sb)return;const cfg=loadSyncCfg(),id=String(cfg.recordId||'1');state.updatedAt=now();const payload=structuredClone(state);payload.syncLastAt=now();const{error}=await sb.from('livro').upsert({id,data:payload,updated_at:payload.updatedAt});if(error){syncErr=true;throw error}syncErr=false;state.syncLastAt=payload.syncLastAt;localStorage.setItem(STORE_KEY,JSON.stringify(state));if(notify)toast('Sincronizado','Dados enviados para a casa compartilhada.','gold')}

function stopRealtime(){if(realtimeChannel&&sb){try{sb.removeChannel(realtimeChannel)}catch{}}realtimeChannel=null}
function startRealtime(){stopRealtime();if(!sb)return;const cfg=loadSyncCfg(),id=String(cfg.recordId||'1');try{realtimeChannel=sb.channel(`livro-${id}`).on('postgres_changes',{event:'*',schema:'public',table:'livro',filter:`id=eq.${id}`},()=>{if(!document.hidden)syncNow(true)}).subscribe()}catch(e){console.warn('Realtime indisponível; usando polling.',e)}}
async function initSync(silent=false){const cfg=loadSyncCfg();if(!cfg.url||!cfg.key){sb=null;return}try{await loadSupabaseLib();sb=window.supabase.createClient(cfg.url,cfg.key);syncErr=false;await syncNow(silent);startRealtime()}catch(e){console.error(e);stopRealtime();sb=null;syncErr=true;if(!silent)toast('Falha na sincronização','Confira URL, chave, tabela e políticas.','warn')}}
function connectSync(){const url=$('#sync-url').value.trim(),key=$('#sync-key').value.trim(),recordId=$('#sync-record').value.trim()||'1';if(!url||!key){toast('Faltam dados','Informe a URL e a chave publishable/anon.','warn');return}const old=loadSyncCfg(),next={url,key,recordId};if(syncSignature(old)===syncSignature(next)&&old.joinedSig)next.joinedSig=old.joinedSig;saveSyncCfg(next);toast('Conectando…','Se a casa já existir, vou adotar as mesmas pessoas e mesclar os lançamentos.');initSync(false).then(()=>modalSettings())}

case'submit-entry':submitEntry(a.dataset.mode);break;case'pay':payEntry(a.dataset.id);break;case'confirm-pay':confirmPay(a.dataset.id);break;case'reopen':reopenEntry(a.dataset.id);break;case'edit':{const e=E(a.dataset.id);if(e)modalEntry('edit',e);break}case'del':delEntry(a.dataset.id);break;case'view-installments':viewInstallments(a.dataset.gid);break;case'cancel-future-installments':cancelFutureInstallments(a.dataset.gid);break;

case'settle-suggest':modalSettlement({from:a.dataset.from,to:a.dataset.to,amount:+a.dataset.amount});break;case'manual-settle':modalSettlement();break;case'submit-settlement':submitSettlement();break;case'del-settle':delSettlement(a.dataset.id);break;
case'goto-fund':ui.view='fundo';saveUi();renderAll();scrollTo({top:0});break;case'fund-deposit':modalFund(a.dataset.mode);break;case'submit-fund':submitFund(a.dataset.mode);break;case'fund-save-surplus':fundSaveSurplus();break;case'del-fund':delFund(a.dataset.id);break;case'edit-fund-goal':modalFundGoal();break;case'submit-goal':submitGoal();break;
case'add-person':addPerson();break;case'archive-person':archivePerson(a.dataset.pid);break;case'restore-person':restorePerson(a.dataset.pid);break;case'person-color':{const p=P(a.dataset.pid);if(p){p.color=a.dataset.color;touch(p);persist();modalSettings();renderHeader()}break}case'add-cat':{const type=a.dataset.type,input=$(`#new-cat-${type}`),v=input.value.trim();if(v&&!state.categories[type].some(x=>x.toLowerCase()===v.toLowerCase())){state.categories[type].push(v.slice(0,25));persist();modalSettings()}break}case'remove-cat':{const type=a.dataset.type,c=a.dataset.cat;if(state.categories[type].length<=1){toast('Mantenha uma categoria','É preciso ter pelo menos uma.','warn');break}state.categories[type]=state.categories[type].filter(x=>x!==c);persist();modalSettings();break}
case'export-data':exportData();break;case'import-data':$('#import-file').click();break;case'confirm-import':confirmImport();break;case'clear-demo':clearDemo();break;case'clear-local':clearLocal();break;case'wipe-shared':wipeShared();break;
case'sync-connect':connectSync();break;case'sync-now':syncNow(false);break;case'sync-disconnect':disconnectSync();break;
case'ob-add-person':state.profiles.push({id:uid(),name:`Pessoa ${activeProfiles().length+1}`,color:COLORS[state.profiles.length%COLORS.length],active:true,updatedAt:now()});onboardingRerender();break;case'ob-remove-person':if(activeProfiles().length>1){P(a.dataset.pid).active=false;onboardingRerender()}else toast('Falta uma pessoa','Deixe pelo menos uma pessoa ativa.','warn');break;case'ob-start':finishOnboarding();break;
case'confirm-generic':{const fn=window.__confirm;window.__confirm=null;closeModal();if(fn)fn();break}case'undo':undoLast();break;
}}
document.addEventListener('click',e=>{const a=e.target.closest?.('[data-action]');if(!a)return;try{handleAction(a.dataset.action,a)}catch(err){console.error(err);toast('Algo falhou','Essa ação não pôde ser concluída.','warn')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-role="reg-search"]')){ui.reg.q=e.target.value;saveUi();const l=$('#reg-list');if(l){l.innerHTML=entryList();refreshIcons(l)}}if(e.target.id==='f-amount'){updateSplitSummary();updateInstallPreview()}if(e.target.matches('.split-val'))updateSplitSummary();if(e.target.matches('[data-role="house-name"]')){state.houseName=e.target.value.trim().slice(0,40)||'Nossa casa';state.houseUpdatedAt=now();persist();renderHeader()}if(e.target.matches('[data-role="person-name"]')){const p=P(e.target.dataset.pid);if(p&&e.target.value.trim()){p.name=e.target.value.trim().slice(0,25);touch(p);persist();renderHeader()}}});
document.addEventListener('change',e=>{if(e.target.id==='f-paid'){$('#payer-wrap').style.display=e.target.checked?'block':'none'}if(e.target.id==='f-fixed'){$('#install-toggle-row').style.display=e.target.checked?'none':'flex';if(e.target.checked){$('#f-install').checked=false;$('#install-box').style.display='none'}}if(e.target.id==='f-install'){$('#install-box').style.display=e.target.checked?'block':'none';updateInstallPreview()}if(e.target.id==='install-kind')updateInstallPreview();if(e.target.matches('[data-role="fix-toggle"]')){const r=R(e.target.dataset.rid);if(r){commit(e.target.checked?'Conta fixa reativada':'Conta fixa pausada',r.title,()=>{r.active=e.target.checked;touch(r)});if(ui.view==='lanc')renderMain()}}if(e.target.id==='import-file'&&e.target.files?.[0]){handleImportFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{const modal=$('#modal');if(!modal)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const f=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

try{renderAll();if(!state.onboarded)modalOnboarding();initSync(true).catch(()=>{});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(err){console.error(err);$('#main').innerHTML=`<div class="empty" style="margin-top:30px"><b>Não foi possível iniciar</b><span>${esc(err.message||'Erro inesperado')}. Seus dados continuam salvos no navegador.</span></div>`}
